<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Flight | SkyVoyage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">✈ SkyVoyage</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="booking.html" class="active">Book a Flight</a>
      <a href="mybookings.html">My Bookings</a>
    </nav>
  </header>

  <section class="booking-section">
    <div class="booking-container">
      <h1>Book a Flight</h1>
      <p>Plan your next trip easily with SkyVoyage ✈</p>

      <form id="flightBookingForm">
        <div class="form-group">
          <label for="from">From</label>
          <select id="from" required>
            <option value="" disabled selected>Select departure city</option>
            <option value="Cebu">Cebu</option>
            <option value="Manila">Manila</option>
            <option value="Davao">Davao</option>
            <option value="Iloilo">Iloilo</option>
            <option value="Bacolod">Bacolod</option>
          </select>
        </div>

        <div class="form-group">
          <label for="to">To</label>
          <select id="to" required>
            <option value="" disabled selected>Select destination city</option>
            <option value="Cebu">Cebu</option>
            <option value="Manila">Manila</option>
            <option value="Davao">Davao</option>
            <option value="Iloilo">Iloilo</option>
            <option value="Bacolod">Bacolod</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tripType">Trip Type</label>
          <select id="tripType" required>
            <option value="oneway">One Way</option>
            <option value="roundtrip">Round Trip</option>
          </select>
        </div>

        <div class="form-group">
          <label for="departure">Departure Date</label>
          <input type="date" id="departure" required>
        </div>

        <div class="form-group" id="returnGroup" style="display: none;">
          <label for="return">Return Date</label>
          <input type="date" id="return">
        </div>

        <div class="form-group">
          <label for="passengers">Passengers</label>
          <input type="number" id="passengers" min="1" value="1" required>
        </div>
        <button type="submit" class="cta-btn" onclick="window.location.href='flight.html'">Search Flight</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
