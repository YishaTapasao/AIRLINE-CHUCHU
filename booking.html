<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Flight | SkyVoyage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">✈ SkyVoyage</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="booking.html" class="active">Book a Flight</a>
      <a href="mybookings.html">My Bookings</a>
    </nav>
  </header>

  <!-- Booking Section -->
  <section class="booking-section">
    <div class="booking-container">
      <h1>Book a Flight</h1>
      <p>Plan your next trip easily with SkyVoyage ✈</p>

      <form id="flightBookingForm">
        <div class="form-group">
          <label for="from">From</label>
          <input type="text" id="from" placeholder="Enter departure city" required>
        </div>

        <div class="form-group">
          <label for="to">To</label>
          <input type="text" id="to" placeholder="Enter destination city" required>
        </div>

        <div class="form-group">
          <label for="tripType">Trip Type</label>
          <select id="tripType" required>
            <option value="one-way">One Way</option>
            <option value="round-trip">Round Trip</option>
          </select>
        </div>

        <div class="form-group">
          <label for="departure">Departure Date</label>
          <input type="date" id="departure" required>
        </div>

        <!-- This part will show or hide -->
        <div class="form-group" id="returnGroup" style="display: none;">
          <label for="return">Return Date</label>
          <input type="date" id="return">
        </div>

        <div class="form-group">
          <label for="passengers">Passengers</label>
          <input type="number" id="passengers" min="1" value="1" required>
        </div>

        <button type="submit" class="cta-btn">Search Flight</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
